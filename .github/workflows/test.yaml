name: Julia tests using the JLL release

on:
  push:
    branches: [main, feat/jll-backend]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1.12']
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Bootstrap the approved staging release until General registration
        # Remove this step after the JLL is registered. No C++ compiler or source checkout.
        env:
          JLL_URL: https://github.com/pals-project/PALSParserCpp_jll.jl.git
          JLL_REV: PALSParserCpp-v0.1.0+0
        run: julia --project=. -e 'using Pkg; Pkg.add(PackageSpec(url=ENV["JLL_URL"], rev=ENV["JLL_REV"]))'
      - name: Test the artifact-backed wrapper
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
