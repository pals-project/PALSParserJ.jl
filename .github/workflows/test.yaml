name: Julia tests with bundled JLL

on:
  push:
    branches: [main, feat/jll-packaging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Install bundled JLL and test
        shell: julia --project=. {0}
        run: |
          using Pkg
          Pkg.develop(path="contrib/PALSParserCpp_jll")
          Pkg.instantiate()
          Pkg.test()
